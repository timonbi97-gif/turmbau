<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1b2a4a">
    <title>Turmbau - Baue den höchsten Turm!</title>
    <meta name="description" content="Turmbau: Ein Physik-Turmbauspiel direkt im Browser. Baue den höchsten Turm, ohne dass er umkippt!">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b2a4a; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(#4f8fe0, #a9d0ff 70%, #5c9e52 70%);
        font-family: "Segoe UI", Arial, sans-serif; color: #fff; transition: opacity .6s ease; z-index: 2;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #title { font-size: clamp(42px, 9vw, 96px); font-weight: 900; letter-spacing: 4px; text-shadow: 0 4px 0 rgba(0,0,0,.25); margin-bottom: 8px; }
      #subtitle { font-size: clamp(14px, 3vw, 20px); opacity: .9; margin-bottom: 36px; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
      #tower { display: flex; flex-direction: column-reverse; align-items: center; height: 170px; margin-bottom: 26px; }
      .blk { height: 26px; margin-top: 3px; border-radius: 4px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.35);
             opacity: 0; transform: translateY(-120px); animation: drop .5s cubic-bezier(.3,1.5,.6,1) forwards; }
      @keyframes drop { to { opacity: 1; transform: translateY(0); } }
      #bar { width: min(420px, 75vw); height: 18px; border-radius: 9px; background: rgba(0,0,0,.25); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.25); }
      #fill { height: 100%; width: 0%; border-radius: 9px; background: linear-gradient(90deg, #f6bd3f, #ffde7a); transition: width .2s; }
      #pct { margin-top: 10px; font-size: 15px; opacity: .9; }
      #error { display: none; max-width: 80vw; margin-top: 20px; padding: 12px 18px; border-radius: 10px; background: rgba(160,30,30,.85); font-size: 15px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="title">TURMBAU</div>
      <div id="subtitle">Baue den höchsten Turm - aber lass ihn nicht umkippen!</div>
      <div id="tower"></div>
      <div id="bar"><div id="fill"></div></div>
      <div id="pct">Lade ... 0 %</div>
      <div id="error"></div>
    </div>
    <script src="Build/itch-web.loader.js"></script>
    <script>
      // Kleiner Ladeturm: mit dem Fortschritt fallen nach und nach Blöcke auf den Stapel.
      var colors = ["#f5bd40", "#db4d4d", "#66cc6b", "#474c5c", "#ff6bb8", "#b3ebff"];
      var widths = [110, 96, 140, 88, 100, 84];
      var placed = 0;
      function addBlocks(progress) {
        var target = Math.min(colors.length, Math.floor(progress * colors.length + 0.0001));
        var tower = document.getElementById("tower");
        while (placed < target) {
          var b = document.createElement("div");
          b.className = "blk";
          b.style.width = widths[placed] + "px";
          b.style.background = colors[placed];
          b.style.marginLeft = ((placed % 2 ? 1 : -1) * (6 + placed * 2)) + "px";
          tower.appendChild(b);
          placed++;
        }
      }
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/itch-web.data.unityweb",
        frameworkUrl: "Build/itch-web.framework.js.unityweb",
        codeUrl: "Build/itch-web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Tibae",
        productName: "Turmbau",
        productVersion: "1.2.0",
      }, function (progress) {
        document.getElementById("fill").style.width = (100 * progress) + "%";
        document.getElementById("pct").textContent = "Lade ... " + Math.round(100 * progress) + " %";
        addBlocks(progress);
      }).then(function () {
        addBlocks(1);
        setTimeout(function () { document.getElementById("loader").classList.add("done"); canvas.focus(); }, 400);
      }).catch(function (message) {
        var e = document.getElementById("error");
        e.style.display = "block";
        e.textContent = "Das Spiel konnte nicht geladen werden: " + message;
      });
    </script>
  </body>
</html>
